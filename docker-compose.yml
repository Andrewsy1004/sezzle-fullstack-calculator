services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: calculator-backend:local
    container_name: calculator-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # Frontend is same-origin behind nginx in this setup, so CORS can stay
      # locked down; loosen this if you call the API directly from a browser
      # on another origin.
      CORS_ALLOWED_ORIGIN: "*"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: calculator-frontend:local
    container_name: calculator-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
