server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the Go backend service (see docker-compose.yml).
    # The frontend calls same-origin "/api/*", so no CORS handling is
    # needed in the browser at all in the Docker setup.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://backend:8080/health;
    }

    # SPA fallback: let React Router / client-side routing (if ever added)
    # handle unknown paths instead of returning nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; index.html stays revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
